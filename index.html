<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KXFLIX</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- CONNEXION -->
  <div id="password-screen">
    <div class="login-background"></div>

    <div class="password-box">
      <div class="kx-square">KX</div>
      <div class="login-line"></div>

      <h1>KX<span>FLIX</span></h1>

      <div id="name-step">
        <p class="login-title">Bienvenue</p>
        <p class="login-subtitle">Comment doit-on vous appeler ?</p>

        <input
          type="text"
          id="name-input"
          placeholder="Votre prénom"
          autocomplete="off"
          maxlength="20"
        >

        <button id="name-button">CONTINUER</button>
      </div>

      <div id="password-step" class="hidden">
        <p class="login-title">
          Bonjour <span id="name-preview"></span>
        </p>

        <p class="login-subtitle">
          Entrez le mot de passe pour continuer
        </p>

        <input
          type="password"
          id="password-input"
          placeholder="Mot de passe"
          autocomplete="off"
        >

        <button id="password-button">ENTRER</button>

        <div id="password-error">
          Mot de passe incorrect
        </div>
      </div>
    </div>
  </div>


  <!-- SITE -->
  <main id="site">

    <div class="red-glow glow-one"></div>
    <div class="red-glow glow-two"></div>

    <header class="header">
      <div class="logo">
        KX<span>FLIX</span>
      </div>

      <div class="welcome-message">
        Bienvenue, <strong id="welcome-name"></strong>
      </div>
    </header>


    <section class="movies-section">

      <div class="section-intro">
        <span class="intro-line"></span>
        <p>Votre sélection</p>
        <span class="intro-line"></span>
      </div>

      <div class="carousel-wrapper">

        <button
          class="carousel-arrow arrow-left"
          id="arrow-left"
          aria-label="Film précédent"
        >
          ‹
        </button>

        <div class="carousel" id="carousel">
          <div class="film-track" id="film-track"></div>
        </div>

        <button
          class="carousel-arrow arrow-right"
          id="arrow-right"
          aria-label="Film suivant"
        >
          ›
        </button>

      </div>

      <div class="mobile-hint">
        ← Glissez pour parcourir →
      </div>

      <div class="carousel-dots" id="carousel-dots"></div>

    </section>


    <a
      class="telegram-link"
      href="https://t.me/kxback"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span>Rejoindre</span>
      <strong>@kxback</strong>
    </a>

  </main>


  <!-- FICHE DU FILM -->
  <div id="film-info">

    <div class="info-box">

      <button id="close-info" aria-label="Fermer">×</button>

      <img id="info-image" src="" alt="">

      <div class="info-content">

        <div class="info-top">
          <span id="info-age"></span>
          <span id="info-year"></span>
        </div>

        <h2 id="info-title"></h2>

        <p id="info-synopsis"></p>

        <button id="launch-film">
          ▶ &nbsp; LANCER LE FILM
        </button>

      </div>

    </div>

  </div>


  <!-- LECTEUR -->
  <div id="lecteur">

    <button id="close-player" aria-label="Fermer">
      ×
    </button>

    <div class="player-container">

      <iframe
        id="video-frame"
        src=""
        allowfullscreen
        allow="autoplay; fullscreen"
        loading="lazy"
      ></iframe>

    </div>

  </div>


  <script src="script.js"></script>

</body>
</html>
